[project]
name = "learning-role-play"
version = "0.1.0"
description = "Conversation-style learning roleplay powered by ChatGPT."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "langchain>=1.3.11",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.8",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.2",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.15.20",
]
